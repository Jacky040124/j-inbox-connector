<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="J-Inbox: every chat in one inbox">
  <style>
    .bg{fill:#FFD23F}
    .t{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#111}
    .h{font-size:72px;font-weight:800;letter-spacing:-1.5px}
    .s{font-size:27px;font-weight:500}
    .card{fill:#fff;stroke:#111;stroke-width:2.5}
    .name{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#111}
    .msg{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;fill:#555}
    .row{opacity:0;animation:in 9s infinite both}
    .r1{animation-delay:0s}.r2{animation-delay:.5s}.r3{animation-delay:1s}.r4{animation-delay:1.5s}
    @keyframes in{0%{opacity:0;transform:translateX(36px)}6%{opacity:1;transform:none}88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
    .approve{opacity:0;animation:ok 9s infinite both;animation-delay:2.4s}
    @keyframes ok{0%{opacity:0}5%{opacity:1}72%{opacity:1}80%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.row,.approve{animation:none;opacity:1}}
  </style>
  <rect class="bg" width="1200" height="320" rx="20"/>
  <text class="t h" x="64" y="136">J-Inbox</text>
  <text class="t s" x="66" y="188">Every chat in one inbox.</text>
  <text class="t s" x="66" y="226">AI agents draft. You decide what gets sent.</text>
  <g transform="translate(700 26)">
    <g class="row r1"><rect class="card" width="436" height="58" rx="12"/><circle cx="32" cy="29" r="11" fill="#25D366"/><text class="name" x="56" y="25">Sam Lee</text><text class="msg" x="56" y="46">WhatsApp · See you at 7</text></g>
    <g transform="translate(0 68)"><g class="row r2"><rect class="card" width="436" height="58" rx="12"/><circle cx="32" cy="29" r="11" fill="#E1306C"/><text class="name" x="56" y="25">Zoë</text><text class="msg" x="56" y="46">Instagram · Sent you a post</text></g></g>
    <g transform="translate(0 136)"><g class="row r3"><rect class="card" width="436" height="58" rx="12"/><circle cx="32" cy="29" r="11" fill="#0A66C2"/><text class="name" x="56" y="25">Vivian Chen</text><text class="msg" x="56" y="46">LinkedIn · Does Wednesday work?</text></g></g>
    <g transform="translate(0 204)"><g class="row r4"><rect class="card" width="436" height="58" rx="12"/><circle cx="32" cy="29" r="11" fill="#EA4335"/><text class="name" x="56" y="25">Project kickoff</text><text class="msg" x="56" y="46">Gmail · Draft by your agent is ready</text>
      <g class="approve"><rect x="336" y="15" width="84" height="28" rx="14" fill="#F58DB5" stroke="#111" stroke-width="2"/><text class="name" x="378" y="35" text-anchor="middle" style="font-size:15px">Send</text></g></g></g>
  </g>
</svg>
